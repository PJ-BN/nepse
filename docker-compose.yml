services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    env_file: .env
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    image: nepse-backend
    env_file: .env
    command: uvicorn nepse.main:app --host 0.0.0.0 --port 8000 --reload --app-dir src
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 10

  worker:
    build: ./backend
    image: nepse-backend
    env_file: .env
    command: python -m nepse.workers.main
    volumes: [./backend:/app]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    command: npm run dev
    ports: ["3000:3000"]
    volumes: [./frontend:/app, /app/node_modules, /app/.next]
    depends_on: [api]

volumes:
  db-data:
