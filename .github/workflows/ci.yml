name: CI

# Pull requests into main are the only way code lands: run on the PR, and again on main after the merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: nepse
          POSTGRES_PASSWORD: nepse
          POSTGRES_DB: nepse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nepse -d nepse"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://nepse:nepse@localhost:5432/nepse
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: No leftover merge-conflict markers
        working-directory: .
        run: "! git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':!*.lock'"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.22"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Exactly one Alembic head (parallel branches each add a migration; join them in the PR)
        run: test "$(uv run alembic heads | grep -c '(head)')" = 1
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - run: uv run lint-imports

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  # One stable check name for branch protection ("CI passed"), whatever jobs are added above.
  ci-passed:
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.backend.result }}" = success && test "${{ needs.frontend.result }}" = success
